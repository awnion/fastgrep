name: Release

on:
  push:
    tags: ["v*"]

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
  test:
    uses: ./.github/workflows/_test.yml
  build:
    needs: [lint, test]
    uses: ./.github/workflows/_build.yml
    with:
      toolchain: stable

  smoke-test:
    name: Smoke test (${{ matrix.target }}, ${{ matrix.runner }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # Test the Ubuntu 24.04-built artifacts on the newer OS as well.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: aarch64-apple-darwin
            runner: macos-26
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: grep-${{ matrix.target }}
      - name: Run smoke test
        run: |
          tar xzf grep-${{ matrix.target }}.tar.gz
          chmod +x ./grep
          ./grep --help
          echo "hello world" | ./grep hello
          ./fastgrep --help
          echo "hello world" | ./fastgrep hello

  publish-crates:
    name: Publish to crates.io
    needs: [smoke-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cargo publish creates target/package; rust-cache cleanup misreads its tests directory.
      - name: Publish to crates.io
        run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-github:
    name: Publish GitHub release
    needs: [smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/grep-*; do
            target="${dir#artifacts/grep-}"
            cp "$dir"/grep-*.tar.gz release/
          done
      - name: Extract changelog
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk "/^## v${version}\$/{ found=1; next } /^## /{ if(found) exit } found" CHANGELOG.md)
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES" \
            release/grep-*
