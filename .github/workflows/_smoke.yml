name: Binary compatibility

on:
  workflow_call:

jobs:
  linux:
    name: Smoke test (${{ matrix.target }}, ${{ matrix.image }})
    runs-on: ${{ startsWith(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, ubuntu:26.04, debian:13]
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: grep-${{ matrix.target }}
      - name: Check packaged binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          # Keep checkout/download tooling outside the clean runtime image.
          docker run --rm \
            -e TARGET -e GITHUB_REF_TYPE -e GITHUB_REF_NAME \
            -v "$PWD:/input:ro" "$IMAGE" bash -ec '
              mkdir /tmp/smoke
              cd /tmp/smoke
              cp /input/Cargo.toml .
              cp "/input/grep-$TARGET.tar.gz" .
              bash /input/.github/scripts/smoke-test.sh
            '

  macos:
    name: Smoke test (Apple Silicon, macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: grep-aarch64-apple-darwin
      - name: Check packaged binaries
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
        run: bash .github/scripts/smoke-test.sh
