name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm, macos-26-intel]
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install GNU grep
        if: runner.os == 'macOS'
        run: brew list grep >/dev/null 2>&1 || brew install grep
      - name: Run unit, integration, and doc tests
        run: cargo +${{ matrix.toolchain }} test --locked
