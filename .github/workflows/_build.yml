name: Build

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: nightly

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ inputs.toolchain }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: aarch64-apple-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: contains(matrix.target, 'aarch64-unknown-linux') || contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ contains(matrix.target, 'aarch64') && 'gcc-aarch64-linux-gnu' || '' }} \
            ${{ contains(matrix.target, 'musl') && 'musl-tools' || '' }}
      - name: Build release binary
        run: cargo +${{ inputs.toolchain }} build --locked --release --bins --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
      - name: Package binary
        run: tar czf grep-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release grep fastgrep
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: grep-${{ matrix.target }}
          path: grep-${{ matrix.target }}.tar.gz
