name: Build

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: nightly

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ inputs.toolchain }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: aarch64-apple-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo +${{ inputs.toolchain }} build --locked --release --bins --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - name: Check help and version
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for binary in grep fastgrep; do
            path="target/$TARGET/release/$binary"
            "$path" --help
            version=$("$path" --version)
            printf '%s\n' "$version"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              expected_version="${GITHUB_REF_NAME#v}"
              printf '%s\n' "$version" | grep -F "grep (fastgrep) $expected_version ("
            fi
          done
      - name: Package binary
        run: tar czf grep-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release grep fastgrep
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: grep-${{ matrix.target }}
          path: grep-${{ matrix.target }}.tar.gz
